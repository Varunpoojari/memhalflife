id = "L02"
name = "Cloud instance-metadata credential access"
technique = "T1552.005"
tactic = "credential-access"
platform = "linux"
environment = "cloud-vm"
timepoints = [0, 5, 15, 60]
notes = """
Cloud angle: a process on the instance queries the metadata service
(169.254.169.254) for temporary role credentials. Test against a lab role
with no permissions. Interesting question: the curl process and its socket are
short-lived, but the interactive shell's history can persist in memory much
longer - the half-lives of these artefacts should differ sharply.
"""

[[artefact]]
id = "imds_in_shell_history"
category = "cloud"
weight = 3
plugin = "linux.bash.Bash"
description = "Shell history containing a metadata-service credential query."
[artefact.match]
Command = '169\.254\.169\.254.*(iam|security-credentials|api/token|identity)'
[artefact.partial]
Command = '169\.254\.169\.254'
[artefact.synthetic]
p = [0.95, 0.95, 0.9, 0.85]
row = { PID = 2200, Process = "bash", Command = "curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/lab-role" }
partial_row = { PID = 2200, Process = "bash", Command = "curl http://169.254.169.254/" }

[[artefact]]
id = "imds_curl_argv"
category = "cloud"
weight = 3
plugin = "linux.psaux.PsAux"
description = "Live process whose arguments target the metadata service."
[artefact.match]
ARGS = '169\.254\.169\.254'
[artefact.synthetic]
p = [0.9, 0.3, 0.05, 0.0]
row = { PID = 3400, PPID = 2200, COMM = "curl", ARGS = "curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/lab-role" }

[[artefact]]
id = "imds_socket"
category = "network"
weight = 2
plugin = "linux.sockstat.Sockstat"
description = "Socket to the metadata endpoint."
[artefact.match]
"Destination Addr" = '^169\.254\.169\.254$'
[artefact.synthetic]
p = [0.7, 0.15, 0.0, 0.0]
row = { PID = 3400, "Process Name" = "curl", Proto = "TCP", "Destination Addr" = "169.254.169.254", "Destination Port" = "80", State = "CLOSE_WAIT" }
